<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin · BoostBang</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png">
<style>
:root{--bg:#0d0d0d;--card:#151515;--bd:#2a2a2a;--tx:#eee;--mu:#999;--y:#E10600;--gr:#2BD46A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:#ff6b63}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:#080808;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.top img{height:26px}
.top .sp{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;border-bottom:1px solid var(--bd);background:#0a0a0a;position:sticky;top:51px;z-index:19}
.tabs button{white-space:nowrap;border:1px solid var(--bd);background:var(--card);padding:8px 12px;border-radius:6px;cursor:pointer;min-height:40px}
.tabs button[aria-selected=true]{border-color:var(--y);background:#2a0505}
main{max-width:1100px;margin:0 auto;padding:18px 16px 120px}
h1{font-size:22px;margin:0 0 4px}
h2{font-size:18px;margin:24px 0 8px}
.mu{color:var(--mu)}
.btn{border:1px solid var(--y);background:var(--y);color:#fff;padding:9px 16px;border-radius:6px;cursor:pointer;min-height:40px}
.btn.g{background:transparent;color:var(--tx);border-color:#444}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:12px 0}
.item{display:grid;grid-template-columns:140px 1fr;gap:14px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:10px 0}
@media(max-width:640px){.item{grid-template-columns:1fr}}
.thumb{width:140px;aspect-ratio:1;object-fit:cover;background:#000;border-radius:6px;border:1px solid var(--bd)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.fields .wide{grid-column:1/-1}
label{display:grid;gap:4px;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{background:#0c0c0c;border:1px solid #333;border-radius:6px;padding:8px 10px;min-height:38px;width:100%;text-transform:none;letter-spacing:0;font-size:15px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--y);border-color:var(--y)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.imgf{display:grid;gap:6px}
.mgr{display:grid;gap:8px}.mgr>span{font-size:13px;color:var(--mu)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.mi{position:relative;border:1px solid var(--bd);border-radius:8px;overflow:hidden;background:#000}
.mi.main{border:2px solid var(--y)}
.mi img,.mi video{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.mi .tag{position:absolute;top:6px;left:6px;background:var(--y);color:#fff;font:700 11px system-ui;padding:3px 7px;border-radius:4px}
.mi .vt{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.7);color:#fff;font:700 11px system-ui;padding:3px 7px;border-radius:4px}
.mi .mb{display:flex;gap:2px;padding:4px;background:#111;flex-wrap:wrap}
.mi .mb button{flex:1;min-width:28px;background:#1d1d1d;color:#ddd;border:1px solid var(--bd);border-radius:5px;padding:6px 0;cursor:pointer;font-size:13px}
.mi .mb button:hover{border-color:var(--y)}
.madd{display:grid;place-items:center;aspect-ratio:4/3;border:2px dashed var(--bd);border-radius:8px;color:var(--mu);cursor:pointer;text-align:center;padding:8px;font-size:13px}
.madd:hover{border-color:var(--y);color:#fff}

.imgf .pv{display:flex;gap:8px;align-items:center}
.imgf img,.imgf video{width:64px;height:64px;object-fit:cover;border-radius:6px;background:#000;border:1px solid var(--bd)}
.savebar{position:fixed;left:0;right:0;bottom:0;background:#080808;border-top:1px solid var(--bd);padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:flex-end;z-index:30}
.savebar .st{margin-right:auto;color:var(--mu)}
.dirty .st{color:#e3a33b}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--bd);padding:8px;text-align:left;vertical-align:top}
.login{max-width:420px;margin:12vh auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:24px;display:grid;gap:12px}
.toast{position:fixed;top:70px;right:16px;background:#111;border:1px solid var(--gr);padding:10px 14px;border-radius:8px;z-index:50}
.toast.err{border-color:var(--y)}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;background:#222;font-size:12px}
.sub{border:1px dashed #333;border-radius:8px;padding:10px;display:grid;gap:8px}
.sub .si{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:center}
</style>
</head>
<body>
<div id="app"><div class="login"><p class="mu">Cargando…</p></div></div>
<script src="assets/js/supa-config.js"></script>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const ADMIN='joelachurra@gmail.com';
const sb=createClient(BB_SUPA.url,BB_SUPA.anonKey);
const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=(m,err)=>{const t=document.createElement('div');t.className='toast'+(err?' err':'');t.role='status';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),3500)};

/* ---------- login ---------- */
async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return showLogin();
  if((session.user.email||'').toLowerCase()!==ADMIN){app.innerHTML=`<div class="login"><h1>Sin acceso</h1><p>La cuenta ${esc(session.user.email)} no es administradora.</p><button class="btn g" id="out">Salir</button></div>`;document.getElementById('out').onclick=()=>sb.auth.signOut().then(()=>location.reload());return}
  boot(session);
}
function showLogin(){
  app.innerHTML=`<form class="login" id="lf"><img src="assets/img/logoWhite.webp" alt="BoostBang" style="height:34px"><h1>Panel de administración</h1>
  <p class="mu">Te enviamos un enlace de acceso a tu correo. No hay contraseña.</p>
  <label>Correo<input type="email" id="em" value="${ADMIN}" required autocomplete="email"></label>
  <button class="btn" id="sb">Enviarme el enlace</button><p id="msg" class="mu" role="status"></p></form>`;
  document.getElementById('lf').onsubmit=async e=>{e.preventDefault();const em=document.getElementById('em').value.trim().toLowerCase();const msg=document.getElementById('msg');
    if(em!==ADMIN){msg.textContent='Ese correo no tiene acceso.';return}
    document.getElementById('sb').disabled=true;
    const {error}=await sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin+location.pathname}});
    msg.textContent=error?('No se pudo enviar: '+error.message):'Listo. Revisa tu correo y abre el enlace en este mismo navegador.';
    document.getElementById('sb').disabled=false};
}
sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_IN'&&!window.__booted)start()});

/* ---------- datos ---------- */
const D={site:null,gauges:null};let dirty={site:false,gauges:false};
async function loadDoc(id,defUrl){
  const def=await fetch(defUrl,{cache:'no-store'}).then(r=>r.json());
  const {data}=await sb.from('content').select('data').eq('id',id).maybeSingle();
  return Object.assign(def,data&&data.data||{});
}
async function save(){
  const b=document.getElementById('save');b.disabled=true;b.textContent='Guardando…';
  try{for(const id of ['site','gauges'])if(dirty[id]){const {error}=await sb.from('content').upsert({id,data:D[id],updated_at:new Date().toISOString()});if(error)throw error;dirty[id]=false}
    toast('Guardado. Ya se ve en el sitio.');}catch(e){toast('No se pudo guardar: '+e.message,true)}
  b.disabled=false;b.textContent='Guardar cambios';markDirty();
}
function markDirty(id){if(id)dirty[id]=true;const d=dirty.site||dirty.gauges;document.body.classList.toggle('dirty',d);const s=document.getElementById('st');if(s)s.textContent=d?'Tienes cambios sin guardar':'Todo guardado'}
window.addEventListener('beforeunload',e=>{if(dirty.site||dirty.gauges){e.preventDefault();e.returnValue=''}});

/* ---------- subida de archivos (fotos se comprimen a WebP) ---------- */
async function compress(file){
  if(!file.type.startsWith('image/')||file.type==='image/gif'||file.type==='image/svg+xml')return file;
  const img=await createImageBitmap(file);const max=1800;const k=Math.min(1,max/Math.max(img.width,img.height));
  const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/webp',.82));return new File([blob],file.name.replace(/\.\w+$/,'')+'.webp',{type:'image/webp'});
}
async function upload(file,folder){
  const f=await compress(file);
  const path=`${folder}/${Date.now()}-${f.name.normalize('NFD').replace(/[^\w.-]+/g,'-').toLowerCase()}`;
  const {error}=await sb.storage.from('media').upload(path,f,{cacheControl:'31536000',contentType:f.type});
  if(error)throw error;
  return sb.storage.from('media').getPublicUrl(path).data.publicUrl;
}


/* ---------- marca de agua para el catálogo de diseños ---------- */
async function watermark(file,code){
  const img=await createImageBitmap(file);const W=720,k=W/img.width,H=Math.round(img.height*k),BAR=56;
  const c=document.createElement('canvas');c.width=W;c.height=H+BAR;const x=c.getContext('2d');
  x.drawImage(img,0,0,W,H);
  x.save();x.beginPath();x.rect(0,0,W,H);x.clip();x.translate(W/2,H/2);x.rotate(20*Math.PI/180);
  x.font='700 34px "Arial Black", Impact, system-ui, sans-serif';x.textAlign='center';x.textBaseline='middle';
  x.fillStyle='rgba(255,255,255,.24)';x.strokeStyle='rgba(0,0,0,.10)';x.lineWidth=1;
  const RN=Math.ceil((H+W)/330)+2;for(let r=-RN,row=0;r<=RN;r++,row++)for(let q=-4;q<=4;q++){const tx=q*330+(row%2?165:0),ty=r*165;x.fillText('BOOSTBANG',tx,ty);x.strokeText('BOOSTBANG',tx,ty)}
  x.restore();
  x.fillStyle='#000';x.fillRect(0,H,W,BAR);
  x.font='700 34px "Arial Black", Impact, system-ui, sans-serif';x.textBaseline='middle';x.textAlign='left';x.fillStyle='#E10600';x.fillText(code,18,H+BAR/2+1);
  const blob=await new Promise(r=>c.toBlob(r,'image/webp',.85));
  return new File([blob],code+'.webp',{type:'image/webp'});
}
function nextCodes(list,n){let m=0;(list||[]).forEach(d=>{const v=parseInt(String(d.code||'').replace(/\D/g,''),10);if(v>m)m=v});
  return Array.from({length:n},(_,i)=>'BB-'+String(m+1+i).padStart(4,'0'))}
const nameFrom=f=>f.name.replace(/\.\w+$/,'').replace(/[-_]+/g,' ').replace(/\s+/g,' ').trim();

/* ---------- fotos y videos de un proyecto: agregar, quitar, ordenar y elegir la principal ---------- */
const isVid=u=>/\.(mp4|webm|mov|m4v)(\?|$)/i.test(u||'');
function mediaMgr(box,it,key,onChange,folder){
  const list=()=>it[key]||(it[key]=[]);
  function draw(){
    box.querySelectorAll('.mgrid').forEach(n=>n.remove());
    const g=document.createElement('div');g.className='mgrid';
    list().forEach((m,i)=>{const d=document.createElement('div');d.className='mi'+(i===0?' main':'');
      d.innerHTML=`${isVid(m.img)?`<video src="${esc(m.img)}" muted loop autoplay playsinline></video><span class="vt">VIDEO</span>`:`<img src="${esc(m.img)}" alt="">`}${i===0?'<span class="tag">PRINCIPAL</span>':''}
       <div class="mb">${i?'<button type="button" data-a="main" title="Hacer principal">★</button>':''}<button type="button" data-a="l" title="Mover antes">←</button><button type="button" data-a="r" title="Mover después">→</button><button type="button" data-a="x" title="Eliminar">✕</button></div>`;
      d.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{const a=list(),A=b.dataset.a;
        if(A==='main'){a.unshift(a.splice(i,1)[0])}
        else if(A==='l'&&i>0){[a[i-1],a[i]]=[a[i],a[i-1]]}
        else if(A==='r'&&i<a.length-1){[a[i+1],a[i]]=[a[i],a[i+1]]}
        else if(A==='x'){if(b.dataset.arm){a.splice(i,1)}else{b.dataset.arm=1;b.textContent='¿Seguro?';b.style.background='#E10600';setTimeout(()=>{delete b.dataset.arm;b.textContent='✕';b.style.background=''},3000);return}}
        else return;
        onChange();draw()});
      g.append(d)});
    const add=document.createElement('label');add.className='madd';
    add.innerHTML='<span>+ Agregar fotos, GIF o videos cortos<br><small>Puedes elegir varios a la vez</small></span><input type="file" accept="image/*,video/mp4,video/webm,video/quicktime" multiple hidden>';
    add.querySelector('input').onchange=async e=>{const files=[...e.target.files];if(!files.length)return;
      for(const [k,f] of files.entries()){add.firstChild.innerHTML=`Subiendo ${k+1} de ${files.length}…`;
        if(f.type.startsWith('video/')&&f.size>40e6){toast(`${f.name}: el video pesa más de 40 MB, recórtalo o comprímelo`,true);continue}
        try{const url=await upload(f,folder);list().push({img:url,pos:'50% 50%',alt:it.name||''});onChange()}catch(err){toast('No se pudo subir '+f.name+': '+err.message,true)}}
      toast('Listo. Recuerda tocar Guardar');draw()};
    g.append(add);box.append(g);
  }
  draw();
}

/* ---------- editor genérico de listas ---------- */
// tipos de campo: text, area, num, sel, img, video, lines, imgs, kv (lista "Clave: Valor")
function fieldHTML(f,v,key){
  const L=`<span>${esc(f.label)}</span>`;const w=f.wide?' class="wide"':'';
  switch(f.t){
   case 'area':return `<label${w}>${L}<textarea data-k="${key}">${esc(v)}</textarea></label>`;
   case 'lines':return `<label${w}>${L}<textarea data-k="${key}" data-lines>${esc((v||[]).join('\n'))}</textarea></label>`;
   case 'kv':return `<label${w}>${L}<textarea data-k="${key}" data-kv placeholder="Pantalla: 2.1″ redonda">${esc((v||[]).map(x=>x.join(': ')).join('\n'))}</textarea></label>`;
   case 'media':return `<div class="mgr wide" data-media="${key}"><span>${esc(f.label)}</span></div>`;
   case 'num':return `<label${w}>${L}<input type="number" step="any" data-k="${key}" value="${esc(v)}"></label>`;
   case 'sel':return `<label${w}>${L}<select data-k="${key}">${f.opts.map(o=>`<option ${o===(v||f.opts[0])?'selected':''}>${esc(o)}</option>`).join('')}</select></label>`;
   case 'img':case 'video':return `<div class="imgf${f.wide?' wide':''}"><label>${L}<input data-k="${key}" value="${esc(v)}" placeholder="URL"></label><div class="pv">${v?(f.t==='img'?`<img src="${esc(v)}" alt="">`:`<video src="${esc(v)}" muted></video>`):''}<label class="btn g sm" style="display:inline-block;text-transform:none">Subir ${f.t==='img'?'foto':'video'}<input type="file" accept="${f.t==='img'?'image/*':'video/*'}" data-up="${key}" hidden></label></div></div>`;
   default:return `<label${w}>${L}<input data-k="${key}" value="${esc(v)}"></label>`;
  }
}
function listEditor(host,{doc,key,fields,title,help,thumb,folder,blank,toItem,fromItem,addLabel,transform,extraAdds}){
  toItem=toItem||(x=>x);fromItem=fromItem||(x=>x);
  const arr=()=>D[doc][key]||(D[doc][key]=[]);
  function draw(){
    host.innerHTML=`<h1>${esc(title)}</h1>${help?`<p class="mu">${help}</p>`:''}<div class="row"><button class="btn" data-add>${addLabel||'+ Agregar'}</button>${(extraAdds||[]).map((x,j)=>`<button class="btn g" data-xadd="${j}">${esc(x.label)}</button>`).join('')}</div><div data-list></div>`;
    const list=host.querySelector('[data-list]');
    arr().forEach((raw,i)=>{const it=toItem(raw);const el=document.createElement('div');el.className='item';
      const th=thumb&&it[thumb]&&!isVid(it[thumb])?it[thumb]:null;
      el.innerHTML=`<div>${th?`<img class="thumb" src="${esc(th)}" alt="">`:`<div class="thumb" style="display:grid;place-items:center;color:#555">#${i+1}</div>`}
       <div class="row"><button class="btn g sm" data-mv="-1" aria-label="Subir">↑</button><button class="btn g sm" data-mv="1" aria-label="Bajar">↓</button><button class="btn g sm" data-del>Eliminar</button></div></div>
       <div class="fields">${fields.map(f=>fieldHTML(f,it[f.k],f.k)).join('')}</div>`;
      const commit=()=>{arr()[i]=fromItem(it);markDirty(doc)};
      el.querySelectorAll('[data-media]').forEach(box=>mediaMgr(box,it,box.dataset.media,()=>{commit();const th=el.querySelector('.thumb');const m=(it[box.dataset.media]||[])[0];if(th&&th.tagName==='IMG'&&m&&!isVid(m.img))th.src=m.img},folder||key));
      el.querySelectorAll('[data-k]').forEach(inp=>inp.addEventListener('input',()=>{const k=inp.dataset.k;const f=fields.find(x=>x.k===k);
        let v=inp.value;if(inp.hasAttribute('data-lines'))v=v.split('\n').map(s=>s.trim()).filter(Boolean);
        else if(inp.hasAttribute('data-kv'))v=v.split('\n').map(s=>s.split(':')).filter(p=>p[0].trim()).map(p=>[p[0].trim(),p.slice(1).join(':').trim()]);
        else if(f.t==='num')v=v===''?'':Number(v);
        it[k]=v;commit();if(k===thumb){const im=el.querySelector('.thumb');if(im&&im.tagName==='IMG')im.src=v}}));
      el.querySelectorAll('[data-up]').forEach(inp=>inp.addEventListener('change',async()=>{const file=inp.files[0];if(!file)return;const k=inp.dataset.up;
        const lab=inp.parentElement;lab.firstChild.textContent='Subiendo…';
        try{const src=transform?await transform(file,it):file;const url=await upload(src,folder||key);it[k]=url;commit();draw();toast('Archivo subido')}catch(e){toast('No se pudo subir: '+e.message,true);lab.firstChild.textContent='Reintentar'}}));
      el.querySelector('[data-del]').onclick=()=>{if(!confirmDel(el))return;arr().splice(i,1);markDirty(doc);draw()};
      el.querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>{const j=i+Number(b.dataset.mv);if(j<0||j>=arr().length)return;const a=arr();[a[i],a[j]]=[a[j],a[i]];markDirty(doc);draw()});
      list.append(el)});
    host.querySelector('[data-add]').onclick=()=>{arr().unshift(fromItem(structuredClone(blank)));markDirty(doc);draw()};
    host.querySelectorAll('[data-xadd]').forEach(b=>b.onclick=()=>{arr().unshift(fromItem(structuredClone(extraAdds[+b.dataset.xadd].blank)));markDirty(doc);draw()});
  }
  draw();
  return draw;
}
function confirmDel(el){if(el.dataset.arm){return true}el.dataset.arm=1;const b=el.querySelector('[data-del]');b.textContent='¿Seguro? Toca otra vez';b.style.borderColor='#E10600';setTimeout(()=>{delete el.dataset.arm;b.textContent='Eliminar';b.style.borderColor=''},3000);return false}

function textsEditor(host,doc,labels,title){
  const T=D[doc].texts||(D[doc].texts={});
  host.innerHTML=`<h1>${title}</h1><p class="mu">Los saltos de línea se respetan en los títulos.</p><div class="card fields">${Object.keys(labels).map(k=>`<label class="wide"><span>${esc(labels[k])}</span><textarea data-k="${k}">${esc(T[k]??'')}</textarea></label>`).join('')}</div>`;
  host.querySelectorAll('[data-k]').forEach(t=>t.addEventListener('input',()=>{T[t.dataset.k]=t.value;markDirty(doc)}));
}
function objEditor(host,doc,key,fields,title,help){
  const O=D[doc][key]||(D[doc][key]={});
  host.innerHTML=`<h1>${title}</h1>${help?`<p class="mu">${help}</p>`:''}<div class="card fields">${fields.map(f=>fieldHTML(f,O[f.k],f.k)).join('')}</div>`;
  host.querySelectorAll('[data-k]').forEach(inp=>inp.addEventListener('input',()=>{const f=fields.find(x=>x.k===inp.dataset.k);let v=inp.value;
    if(inp.hasAttribute('data-lines'))v=v.split('\n').map(s=>s.trim()).filter(Boolean);else if(f.t==='num')v=v===''?'':Number(v);O[f.k]=v;markDirty(doc)}));
  host.querySelectorAll('[data-up]').forEach(inp=>inp.addEventListener('change',async()=>{const file=inp.files[0];if(!file)return;
    try{O[inp.dataset.up]=await upload(file,key);markDirty(doc);objEditor(host,doc,key,fields,title,help);toast('Archivo subido')}catch(e){toast('No se pudo subir: '+e.message,true)}}));
}

/* ---------- reservas ---------- */
async function ordersView(host){
  host.innerHTML='<h1>Reservas BB Gauges</h1><p class="mu">Cargando…</p>';
  const {data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false});
  if(error){host.innerHTML+=`<p>Error: ${esc(error.message)}</p>`;return}
  const ST=['nuevo','contactado','confirmado','entregado','cancelado'];
  host.innerHTML=`<h1>Reservas BB Gauges</h1><p class="mu">${data.length} en total · ${data.filter(o=>o.status==='nuevo').length} nuevas</p>
  <div class="card" style="overflow-x:auto"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Carro</th><th>Modelo</th><th>Notas</th><th>Estado</th></tr></thead><tbody>
  ${data.map(o=>`<tr><td>${new Date(o.created_at).toLocaleString('es-PA')}</td><td><b>${esc(o.name)}</b><br><a href="https://wa.me/${esc(o.phone.replace(/\D/g,'').replace(/^(\d{8})$/,'507$1'))}" target="_blank" rel="noopener">${esc(o.phone)}</a>${o.email?`<br>${esc(o.email)}`:''}</td><td>${esc(o.car)}</td><td>${esc(o.variant)}<br><span class="pill">${esc(o.accent||'')}</span></td><td>${esc(o.notes||'')}</td>
  <td><select data-id="${o.id}">${ST.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan="6" class="mu">Aún no hay reservas.</td></tr>'}
  </tbody></table></div>`;
  host.querySelectorAll('select[data-id]').forEach(s=>s.onchange=async()=>{const {error}=await sb.from('orders').update({status:s.value}).eq('id',s.dataset.id);toast(error?'No se pudo actualizar':'Estado actualizado',!!error)});
}

/* ---------- arranque del panel ---------- */
async function boot(session){
  window.__booted=true;
  app.innerHTML='<div class="login"><p class="mu">Cargando contenido…</p></div>';
  [D.site,D.gauges]=await Promise.all([loadDoc('site','assets/data/site-defaults.json'),loadDoc('gauges','assets/data/gauges-defaults.json')]);
  const S=D.site;
  const TABS=[
   ['textos','Títulos y textos'],['hero','Portada'],['galeria','Galería'],['proyectos','Proyectos'],['camisetas','Prendas'],['disenos','Diseños'],
   ['otros','Llaveros y precios'],['resenas','Reseñas'],['comunidad','Comunidad'],['g-modelos','BB Gauges · Modelos'],['g-videos','BB Gauges · Videos'],['g-faq','BB Gauges · FAQ'],['g-textos','BB Gauges · Textos'],['reservas','Reservas']];
  app.innerHTML=`<div class="top"><img src="assets/img/logoWhite.webp" alt="BoostBang"><b>Admin</b><span class="sp"></span><a href="index.html" target="_blank">Ver sitio</a><a href="gauges.html" target="_blank">Ver BB Gauges</a><button class="btn g sm" id="out">Salir</button></div>
   <nav class="tabs" role="tablist">${TABS.map(([k,l],i)=>`<button role="tab" data-tab="${k}" aria-selected="${i===0}">${l}</button>`).join('')}</nav>
   <main id="view"></main><div class="savebar"><span class="st" id="st">Todo guardado</span><button class="btn" id="save">Guardar cambios</button></div>`;
  document.getElementById('out').onclick=async()=>{await sb.auth.signOut();location.reload()};
  document.getElementById('save').onclick=save;
  const V=document.getElementById('view');
  const shapes=['land','land big','port','sq'];
  const views={
   textos:()=>textsEditor(V,'site',{heroEyebrow:'Portada · frase pequeña',heroTitle:'Portada · título',heroLead:'Portada · texto',introTitle:'Intro · título',introText:'Intro · texto',gaugesTitle:'BB Gauges (portada) · título',gaugesText:'BB Gauges (portada) · texto',reviewsTitle:'Reseñas · título',galleryTitle:'Galería · título',galleryText:'Galería · texto',buildsTitle:'Proyectos · título',merchTitle:'Merch · título',merchText:'Merch · texto',designsTitle:'Diseños · título',designsText:'Diseños · texto',communityTitle:'Comunidad · título',communityText:'Comunidad · texto'},'Títulos y textos del sitio'),
   hero:()=>{objEditor(V,'site','__hero',[{k:'heroImage',label:'Foto de portada',t:'img',wide:true},{k:'heroPos',label:'Punto de enfoque (ej. 50% 60%)'},{k:'heroAlt',label:'Descripción de la foto',wide:true}],'Portada');
     // la portada vive en claves sueltas del CONFIG
     const O=D.site.__hero;['heroImage','heroPos','heroAlt'].forEach(k=>{if(O[k]===undefined)O[k]=D.site[k]});
     objEditor(V,'site','__hero',[{k:'heroImage',label:'Foto de portada',t:'img',wide:true},{k:'heroPos',label:'Punto de enfoque (ej. 50% 60%)'},{k:'heroAlt',label:'Descripción de la foto',wide:true}],'Portada');
     V.addEventListener('input',()=>Object.assign(D.site,{heroImage:O.heroImage,heroPos:O.heroPos,heroAlt:O.heroAlt}))},
   galeria:()=>listEditor(V,{doc:'site',key:'gallery',title:'Galería',help:'Forma: land (horizontal), land big (horizontal grande), port (vertical), sq (cuadrada). Para un video, sube el video y también una foto de portada.',thumb:'img',
     fields:[{k:'title',label:'Título'},{k:'cat',label:'Categoría',t:'sel',opts:S.categories},{k:'shape',label:'Forma',t:'sel',opts:shapes},{k:'img',label:'Foto',t:'img'},{k:'video',label:'Video (opcional)',t:'video'},{k:'pos',label:'Enfoque (ej. 50% 50%)'},{k:'alt',label:'Descripción de la foto',wide:true}],
     blank:{cat:S.categories[0],shape:'sq',title:'',img:'',pos:'50% 50%',alt:''}}),
   proyectos:()=>listEditor(V,{doc:'site',key:'builds',title:'Proyectos',addLabel:'+ Nuevo proyecto',help:'El orden aquí es el orden en el sitio: usa ↑ ↓ para mover cada proyecto. En "Fotos y videos" la primera es la principal (marco rojo); con ★ eliges otra como principal y con ← → cambias el orden de las miniaturas. Puedes subir fotos, GIF o videos cortos (MP4, de pocos segundos; se reproducen solos y sin sonido). Los enlaces de Instagram, TikTok y YouTube son opcionales: el botón solo aparece si pones el enlace. Al terminar toca Guardar.',thumb:'img',
     fields:[{k:'name',label:'Nombre'},{k:'makeModel',label:'Marca · detalle'},{k:'media',label:'Fotos y videos',t:'media',wide:true},{k:'desc',label:'Historia',t:'area',wide:true},{k:'mods',label:'Modificaciones (una por línea)',t:'lines',wide:true},{k:'ig',label:'Enlace al post de Instagram'},{k:'tt',label:'Enlace al video de TikTok'},{k:'yt',label:'Enlace de YouTube'}],
     toItem:b=>({...b,media:[...(b.img?[{img:b.img,pos:b.pos||'50% 50%',alt:b.alt||b.name}]:[]),...(b.extra||[]).map(x=>typeof x==='string'?{img:x,pos:'50% 50%',alt:b.name}:x)]}),
     fromItem:it=>{const o={...it};const m=it.media||[];const f=m[0]||{};o.img=f.img||'';o.pos=f.pos||'50% 50%';o.alt=f.alt||it.name||'';o.extra=m.slice(1);delete o.media;return o},
     blank:{name:'',makeModel:'',img:'',pos:'50% 50%',alt:'',desc:'',mods:[],extra:[],ig:'',tt:'',yt:''}}),
   camisetas:()=>listEditor(V,{doc:'site',key:'products',title:'Prendas',addLabel:'+ Nueva prenda',help:'Agrega camisetas, hoodies, gorras o lo que quieras vender. Cada tipo que no sea camiseta sale en su propia sección del sitio (por ejemplo "Hoodies"). Para la colaboración con Los Yectos usa el botón "+ Nueva prenda Los Yectos" o elige "Colab · Los Yectos" en ¿Dónde aparece?: sale en ese apartado, con el mismo formato. Si dejas el precio vacío se usa el precio general; si dejas las tallas vacías se usan las tallas generales (gorras y accesorios salen como talla única). La etiqueta sale como cinta sobre la foto (ej: Nuevo, Edición limitada, Agotado). Después de agregar o editar, toca Guardar arriba.',thumb:'img',
     fields:[{k:'type',label:'Tipo de prenda',t:'sel',opts:['Camiseta','Hoodie','Sudadera','Tank top','Gorra','Accesorio','Otro']},{k:'name',label:'Nombre'},{k:'price',label:'Precio (opcional)',t:'num'},{k:'badge',label:'Etiqueta (opcional)'},{k:'img',label:'Foto',t:'img'},{k:'options',label:'Detalle (ej: Estampado en frente y espalda)'},{k:'color',label:'Color fijo (opcional)'},{k:'where',label:'¿Dónde aparece?',t:'sel',opts:['Tienda BoostBang','Colab · Los Yectos']},{k:'sizes',label:'Tallas (opcional, una por línea)',t:'lines'},{k:'alt',label:'Descripción de la foto',wide:true}],
     toItem:p=>({...p,where:p.group==='Los Yectos'?'Colab · Los Yectos':'Tienda BoostBang'}),
     fromItem:it=>{const o={...it};const w=it.where;delete o.where;if(w==='Colab · Los Yectos')o.group='Los Yectos';else if(o.group==='Los Yectos'||w==='Tienda BoostBang'&&o.group==='Los Yectos')o.group='';if(!o.group)delete o.group;return o},
     extraAdds:[{label:'+ Nueva prenda Los Yectos',blank:{type:'Camiseta',name:'',img:'',alt:'',options:'Estampado en frente y espalda',badge:'Colab',group:'Los Yectos'}}],
     blank:{type:'Camiseta',name:'',img:'',alt:'',options:'Estampado en frente y espalda',badge:'Nuevo'}}),
   disenos:()=>{V.innerHTML=`<div class="card" style="margin-bottom:22px"><h1 style="margin-top:0">Subir diseños nuevos</h1>
      <p class="mu">Elige una o varias imágenes. A cada una se le pone sola la marca de agua BOOSTBANG y su código BB (el siguiente número libre), se achica y queda primera en el catálogo. Después revisa el nombre y la marca de cada una y toca <b>Guardar</b>.</p>
      <label class="btn" style="display:inline-block;cursor:pointer"><span>+ Elegir imágenes</span><input type="file" accept="image/*" multiple hidden id="dz-in"></label> <span class="mu" id="dz-st"></span></div><div id="dz-list"></div>`;
     const redraw=listEditor(V.querySelector('#dz-list'),{doc:'site',key:'designs',title:'Catálogo de diseños',help:'El primero de la lista sale primero en el carrusel; usa ↑ ↓ para ordenar. Si cambias la imagen de un diseño, se le pone la marca de agua con su código: cambia el código antes de subir la imagen si quieres otro.',thumb:'img',folder:'designs',
       transform:(f,it)=>watermark(f,it.code&&it.code!=='BB-'?it.code:nextCodes(D.site.designs,1)[0]),
       fields:[{k:'code',label:'Código'},{k:'name',label:'Nombre'},{k:'make',label:'Marca (para el filtro)'},{k:'img',label:'Imagen (se le pone marca de agua)',t:'img'}],blank:{code:'',name:'',make:'',img:''}});
     V.querySelector('#dz-in').onchange=async e=>{const files=[...e.target.files];if(!files.length)return;const st=V.querySelector('#dz-st');
       const list=D.site.designs||(D.site.designs=[]);let ok=0;
       for(const [i,f] of files.entries()){st.textContent=`Procesando ${i+1} de ${files.length}…`;
         try{const code=nextCodes(list,1)[0];const url=await upload(await watermark(f,code),'designs');list.unshift({code,name:nameFrom(f),make:'',img:url});ok++}
         catch(err){toast('No se pudo subir '+f.name+': '+err.message,true)}}
       e.target.value='';st.textContent='';if(ok){markDirty('site');redraw();toast(`${ok} diseño(s) listos con marca de agua. Toca Guardar`)}};
   },
   otros:()=>{V.innerHTML='<div id="a"></div><div id="b"></div>';
     objEditor(V.querySelector('#a'),'site','shirt',[{k:'price',label:'Precio general de camiseta',t:'num'},{k:'gift',label:'Regalo incluido'},{k:'sizes',label:'Tallas (una por línea)',t:'lines'}],'Camisetas: precio y tallas');
     objEditor(V.querySelector('#b'),'site','keychain',[{k:'price',label:'Precio llaveros',t:'num'},{k:'desc',label:'Descripción',t:'area',wide:true},{k:'msg',label:'Mensaje de WhatsApp',t:'area',wide:true}],'Llaveros')},
   resenas:()=>listEditor(V,{doc:'site',key:'reviews',title:'Reseñas',help:'Se muestran en la portada. Si no hay ninguna, la sección no aparece.',
     fields:[{k:'name',label:'Nombre'},{k:'car',label:'Carro o detalle (opcional)'},{k:'stars',label:'Estrellas (1 a 5)',t:'num'},{k:'text',label:'Reseña',t:'area',wide:true}],blank:{name:'',car:'',stars:5,text:''}}),
   comunidad:()=>listEditor(V,{doc:'site',key:'community',title:'Comunidad',thumb:'img',fields:[{k:'img',label:'Foto',t:'img'},{k:'title',label:'Título'},{k:'alt',label:'Descripción',wide:true}],blank:{img:'',pos:'50% 50%',title:'Comunidad BoostBang',cat:'Comunidad',alt:''}}),
   'g-modelos':()=>{const M=D.gauges.models;V.innerHTML='<h1>BB Gauges · Modelos y precios</h1><p class="mu">Deja el precio vacío para mostrar "Precio por anunciar". Specs: una por línea, como "Pantalla: 2.1″ redonda".</p><div id="ml"></div>';
     const ml=V.querySelector('#ml');M.forEach((m,mi)=>{const c=document.createElement('div');c.className='card';
       c.innerHTML=`<div class="fields">${fieldHTML({label:'Nombre'},m.name,'name')}${fieldHTML({label:'Etiqueta',t:'sel',opts:['Preventa','Próximamente','Disponible','Agotado']},m.tag,'tag')}${fieldHTML({label:'Descripción',t:'area',wide:true},m.desc,'desc')}</div>
       ${m.variants.map((v,vi)=>`<h2>Tamaño ${esc(v.label)}</h2><div class="fields" data-v="${vi}">${fieldHTML({label:'Etiqueta del tamaño'},v.label,'label')}${fieldHTML({label:'Precio (ej. $89)'},v.price,'price')}${fieldHTML({label:'Specs',t:'kv',wide:true},v.specs,'specs')}</div>`).join('')}`;
       c.querySelectorAll('[data-k]').forEach(inp=>inp.addEventListener('input',()=>{const vb=inp.closest('[data-v]');const tgt=vb?m.variants[+vb.dataset.v]:m;let v=inp.value;
         if(inp.hasAttribute('data-kv'))v=v.split('\n').map(s=>s.split(':')).filter(p=>p[0].trim()).map(p=>[p[0].trim(),p.slice(1).join(':').trim()]);tgt[inp.dataset.k]=v;markDirty('gauges')}));
       ml.append(c)})},
   'g-videos':()=>listEditor(V,{doc:'gauges',key:'videos',title:'BB Gauges · Videos demo',help:'Sube videos cortos en MP4 (máx. 50 MB). La sección aparece cuando hay al menos uno.',thumb:'poster',folder:'videos',
     fields:[{k:'title',label:'Título'},{k:'url',label:'Video',t:'video'},{k:'poster',label:'Foto de portada (opcional)',t:'img'}],blank:{title:'',url:'',poster:''}}),
   'g-faq':()=>listEditor(V,{doc:'gauges',key:'faq',title:'BB Gauges · Preguntas frecuentes',fields:[{k:'q',label:'Pregunta',wide:true},{k:'a',label:'Respuesta',t:'area',wide:true}],
     toItem:x=>({q:x[0],a:x[1]}),fromItem:x=>[x.q,x.a],blank:['','']}),
   'g-textos':()=>textsEditor(V,'gauges',{heroEyebrow:'Frase pequeña',heroLead:'Texto de portada',modelsTitle:'Modelos · título',modelsText:'Modelos · texto',readsTitle:'Datos · título',readsText:'Datos · texto',installTitle:'Instalación · título',videosTitle:'Videos · título',faqTitle:'FAQ · título',orderTitle:'Pedidos · título',orderText:'Pedidos · texto'},'BB Gauges · Textos'),
   reservas:()=>ordersView(V)
  };
  const tabs=[...document.querySelectorAll('.tabs button')];
  const go=k=>{tabs.forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===k));views[k]();scrollTo(0,0)};
  tabs.forEach(b=>b.onclick=()=>go(b.dataset.tab));
  go(location.hash.slice(1)in views?location.hash.slice(1):'textos');
}
start();
